<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" aria-label="Madeleine Essunger ME Monogram">
  <defs>
    <linearGradient id="meGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C58C89" />
      <stop offset="50%" stop-color="#B17B6A" />
      <stop offset="100%" stop-color="#D99F8D" />
    </linearGradient>
  </defs>

  <!-- Yttre cirkelring -->
  <circle cx="50" cy="50" r="47" stroke="url(#meGrad)" stroke-width="1.5" fill="none" />
  <circle cx="50" cy="50" r="43.5" stroke="url(#meGrad)" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.65" fill="none" />
  <circle cx="50" cy="50" r="40" fill="url(#meGrad)" fill-opacity="0.04" />

  <!-- Initialer M och E i klassisk lyxig serif-typografi -->
  <text x="39" y="64" font-family="'Cormorant Garamond', Georgia, serif" font-size="42" font-weight="600" fill="url(#meGrad)" text-anchor="middle">M</text>
  <text x="61" y="64" font-family="'Cormorant Garamond', Georgia, serif" font-size="42" font-weight="400" font-style="italic" fill="#221E1C" text-anchor="middle">E</text>

  <!-- Subtila mittpunkter -->
  <circle cx="50" cy="21" r="1.4" fill="url(#meGrad)" />
  <circle cx="50" cy="79" r="1.4" fill="url(#meGrad)" />
</svg>
